name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quest_board_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quest_board_test -h 127.0.0.1"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 20
          --health-start-period 2s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Apply test database migrations
        run: bun run migrate:test

      - name: Run tests
        run: bun run test
